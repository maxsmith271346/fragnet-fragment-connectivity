schema_version: 1
description: The 16 retained ZINC-full model variants and seeds 23, 24, and 25 used for the manuscript.
expected_runs: 48
seeds:
- 23
- 24
- 25
hprc:
  source_slurm_settings:
    experiments_per_job: 4
    max_simultaneous_jobs: 4
    sbatch_options:
      gres: gpu:1
      cpus-per-task: 4
      partition: gpu
  modules:
  - GCCcore/12.2.0
  - Python/3.10.8
  - Anaconda3
  conda_environment: fragNet
  default_project_directory: ${SCRATCH}/fragnet-fragment-connectivity
common:
  project_name: ZINC-full
  trainer_params:
    max_epochs: 1000
    testing: true
    min_lr: 1.0e-06
    patience_early_stopping: 100
    gradient_clip_val: 1
    log_every_n_steps: 100
    grad_norm_interval: 0
    track_batch_graph_stats: false
    track_cuda_memory: false
  data:
    dataset_params: {}
    loader_params:
      batch_size: 128
      num_workers: 4
    dataset: ZINC-full
    one_hot_edge_features: false
    one_hot_node_features: false
  model:
    model_type: FragGNNSmall
    classification: false
    model_params:
      hidden_channels: 120
      dropout: 0
      num_layers: 3
      num_layers_out: 2
      inter_message_passing: true
      higher_message_passing: true
      ordinal_encoding: false
      learned_edge_rep: true
      reduction: sum
      inter_message_params:
        reduction: mean
      frag_reduction: max
      atom_feature_params:
        num_atom_types: 30
        num_atom_features: 1
      edge_feature_params:
        num_bond_types: 4
        num_bond_features: 1
  optimization:
    loss: mae
    scheduler_parameters:
      cooldown: 5
      factor: 0.9
      mode: min
      patience: 15
    optimization_params:
      weight_decay: 0
      lr: 0.001
    ema_decay: 0.99
    train_loss_on_step: false
    train_loss_on_epoch: true
variants:
- name: no_fragmentation
  manuscript_label: No fragmentation
  internal_fragmentation: no-fragmentation
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - no-fragmentation
      - higher_level_graph_tree
      - vocab_size: 0
        higher_edge_policy: none
        use_oov_bucket: false
- name: brics_none
  manuscript_label: BRICS — No-HLG-edge
  internal_fragmentation: BRICS
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - BRICS
      - higher_level_graph_tree
      - vocab_size: 200
        higher_edge_policy: none
        use_oov_bucket: true
- name: brics_adjacency
  manuscript_label: BRICS — Adjacency
  internal_fragmentation: BRICS
  internal_policy: adjacent
  config:
    data:
      fragmentation_method:
      - BRICS
      - higher_level_graph_tree
      - vocab_size: 200
        higher_edge_policy: adjacent
        use_oov_bucket: true
- name: fgs_none
  manuscript_label: FGs — No-HLG-edge
  internal_fragmentation: ErtlEFGs
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - ErtlEFGs
      - higher_level_graph_tree
      - vocab_size: 200
        higher_edge_policy: none
        use_oov_bucket: true
- name: fgs_adjacency
  manuscript_label: FGs — Adjacency
  internal_fragmentation: ErtlEFGs
  internal_policy: adjacent
  config:
    data:
      fragmentation_method:
      - ErtlEFGs
      - higher_level_graph_tree
      - vocab_size: 200
        higher_edge_policy: adjacent
        use_oov_bucket: true
- name: fgs_2hop
  manuscript_label: FGs — 2-Hop Adjacency
  internal_fragmentation: ErtlEFGs
  internal_policy: distance
  config:
    data:
      fragmentation_method:
      - ErtlEFGs
      - higher_level_graph_tree
      - vocab_size: 200
        higher_edge_policy: distance
        use_oov_bucket: true
        higher_max_distance: 2
  max_distance: 2
- name: hiframes_none
  manuscript_label: HiFrAMes — No-HLG-edge
  internal_fragmentation: HiFrAMes
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - HiFrAMes
      - higher_level_graph_tree
      - vocab_size: 50
        label_mode: family_size
        higher_edge_policy: none
        use_oov_bucket: false
        chain_size_bins: 18
        linker_size_bins: 12
        ring_size_bins: 20
        keep_terminal_exocyclic_db: true
        keep_chain_exocyclic_db: false
        preserve_ring_linkage_db: false
        keep_terminal_linker_exocyclic_db: false
        keep_chain_linker_exocyclic_db: false
        include_attachment_atoms_in_chain_fragments: true
        include_attachment_atoms_in_linker_fragments: true
        merge_chain_branches_at_carbon_attachments: false
        merge_chain_branches_at_hetero_attachments: true
        merge_bond_linkers_at_carbon_attachments: false
        merge_bond_linkers_at_hetero_attachments: true
- name: hiframes_overlap
  manuscript_label: HiFrAMes — Overlap
  internal_fragmentation: HiFrAMes
  internal_policy: overlap
  config:
    data:
      fragmentation_method:
      - HiFrAMes
      - higher_level_graph_tree
      - vocab_size: 50
        label_mode: family_size
        higher_edge_policy: overlap
        use_oov_bucket: false
        chain_size_bins: 18
        linker_size_bins: 12
        ring_size_bins: 20
        keep_terminal_exocyclic_db: true
        keep_chain_exocyclic_db: false
        preserve_ring_linkage_db: false
        keep_terminal_linker_exocyclic_db: false
        keep_chain_linker_exocyclic_db: false
        include_attachment_atoms_in_chain_fragments: true
        include_attachment_atoms_in_linker_fragments: true
        merge_chain_branches_at_carbon_attachments: false
        merge_chain_branches_at_hetero_attachments: true
        merge_bond_linkers_at_carbon_attachments: false
        merge_bond_linkers_at_hetero_attachments: true
- name: rings_none
  manuscript_label: Rings — No-HLG-edge
  internal_fragmentation: Rings
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - Rings
      - higher_level_graph_tree
      - vocab_size: 15
        higher_edge_policy: none
        use_oov_bucket: false
- name: rings_overlap
  manuscript_label: Rings — Overlap
  internal_fragmentation: Rings
  internal_policy: overlap
  config:
    data:
      fragmentation_method:
      - Rings
      - higher_level_graph_tree
      - vocab_size: 15
        higher_edge_policy: overlap
        use_oov_bucket: false
- name: ringsedbs_none
  manuscript_label: RingsEDBs — No-HLG-edge
  internal_fragmentation: RingsEDBs
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - RingsEDBs
      - higher_level_graph_tree
      - vocab_size: 15
        higher_edge_policy: none
        use_oov_bucket: false
- name: ringsedbs_overlap
  manuscript_label: RingsEDBs — Overlap
  internal_fragmentation: RingsEDBs
  internal_policy: overlap
  config:
    data:
      fragmentation_method:
      - RingsEDBs
      - higher_level_graph_tree
      - vocab_size: 15
        higher_edge_policy: overlap
        use_oov_bucket: false
- name: ringspaths_none
  manuscript_label: RingsPaths — No-HLG-edge
  internal_fragmentation: RingsPaths
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - RingsPaths
      - higher_level_graph_tree
      - vocab_size: 30
        max_ring: 15
        higher_edge_policy: none
        use_oov_bucket: false
- name: ringspaths_overlap
  manuscript_label: RingsPaths — Overlap
  internal_fragmentation: RingsPaths
  internal_policy: overlap
  config:
    data:
      fragmentation_method:
      - RingsPaths
      - higher_level_graph_tree
      - vocab_size: 30
        max_ring: 15
        higher_edge_policy: overlap
        use_oov_bucket: false
- name: ringsfgs_none
  manuscript_label: RingsFGs — No-HLG-edge
  internal_fragmentation: RingsErtlEFGs
  internal_policy: none
  config:
    data:
      fragmentation_method:
      - RingsErtlEFGs
      - higher_level_graph_tree
      - vocab_size: 200
        max_ring: 15
        higher_edge_policy: none
        use_oov_bucket: true
- name: ringsfgs_overlap
  manuscript_label: RingsFGs — Overlap
  internal_fragmentation: RingsErtlEFGs
  internal_policy: overlap
  config:
    data:
      fragmentation_method:
      - RingsErtlEFGs
      - higher_level_graph_tree
      - vocab_size: 200
        max_ring: 15
        higher_edge_policy: overlap
        use_oov_bucket: true
